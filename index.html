
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גדוד 906 "שועלי הנגב" | עמוד קישורים</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:ital,wght@0,500;0,700;0,900;1,700&family=Secular+One&family=Varela+Round&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tactical: {
                            purple: '#8b5cf6',
                            purpleDark: '#5b21b6',
                            purpleAccent: '#c084fc',
                            btnBg: 'rgba(216, 210, 235, 0.78)',
                            btnHover: 'rgba(230, 224, 247, 0.92)',
                            btnBorder: 'rgba(255, 255, 255, 0.85)',
                            text: '#2e2836'
                        }
                    },
                    fontFamily: {
                        military: ['"Secular One"', '"Rubik"', 'sans-serif'],
                        hand: ['"Varela Round"', 'cursive'],
                        rubik: ['"Rubik"', 'sans-serif'],
                        assistant: ['"Assistant"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Assistant', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d1dbe5;
        }

        /* ==================================
           BACKGROUND IMAGE
        ================================== */

        .page-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            pointer-events: none;
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            background: rgba(220, 230, 240, 0.48);
            z-index: 1;
            pointer-events: none;
        }

        /* ==================================
           LINK CARDS
        ================================== */

        .inspo-card {
            background: rgba(212, 206, 232, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1.5px solid rgba(255, 255, 255, 0.85);

            box-shadow:
                0 6px 18px -2px rgba(80, 60, 120, 0.12),
                0 2px 6px -1px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        /* Mobile press animation */

        .inspo-card:active,
        .inspo-card.is-pressed {
            transform: scale(0.975);
            box-shadow: 0 2px 7px rgba(35, 55, 75, 0.18);
        }

        @media (hover: hover) and (pointer: fine) {
            .inspo-card:hover {
                box-shadow: 0 8px 20px rgba(35, 55, 75, 0.16);
            }
        }

        .link-icon-fallback {
            color: #536579;
            font-size: 1.15rem;
        }

        /* ==================================
           EMBLEM IMAGE
        ================================== */

        .emblem-trigger {
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .emblem-trigger:active {
            transform: scale(0.96);
        }

        @media (hover: hover) and (pointer: fine) {
            .emblem-trigger:hover {
                transform: scale(1.025);
            }
        }

        .emblem-image {
            width: 260px;
            max-width: 80vw;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* ==================================
           ANIMATIONS
        ================================== */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ==================================
           SCROLLBAR
        ================================== */

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(83, 107, 131, 0.4);
            border-radius: 10px;
        }

        /* ==================================
           ADMIN MODAL
        ================================== */

        #admin-modal {
            transition: opacity 0.3s ease;
        }

        .admin-input {
            width: 100%;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            color: #334155;
            outline: none;
            transition: border 0.2s ease;
        }

        .admin-input:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 2px rgba(100, 116, 139, 0.12);
        }

        .admin-button {
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .admin-button:active {
            transform: scale(0.96);
        }

    </style>
</head>

<body class="relative select-none">

    <!-- ==================================
         BACKGROUND IMAGE
         תמונה אישית מתוך assets
    ================================== -->

    <div class="fixed inset-0 w-full h-full pointer-events-none z-0">

        <img
            src="asset/גדוד 906 “שעולי הנגב” (2).png"
            alt=""
            class="page-background"
        >

        <div class="background-overlay"></div>

    </div>


    <!-- ==================================
         MAIN CONTAINER
    ================================== -->

    <div class="relative z-10 w-full max-w-md mx-auto min-h-screen px-5 py-8 flex flex-col justify-between">

        <!-- HEADER -->

        <header
            class="flex flex-col items-center text-center mt-2 fade-in-up"
            style="animation-delay: 0.1s;"
        >

            <!-- PERSONAL EMBLEM IMAGE -->

            <button
                onclick="toggleAdminModal()"
                class="emblem-trigger cursor-pointer focus:outline-none p-1 rounded-3xl relative"
                title="לחץ לעריכת קישורים"
                aria-label="עריכת קישורים"
            >

                <img
                    src="asset/image-removebg-preview (2).png"
                    alt="סמל גדוד 906 - שועלי הנגב"
                    class="emblem-image"
                >

            </button>

        </header>


        <!-- ==================================
             DYNAMIC LINK BUTTONS
        ================================== -->

        <main
            id="links-container"
            class="flex-1 flex flex-col justify-center gap-4 my-6"
        >
        </main>


        <!-- FOOTER -->

        <footer
            class="text-center mb-1 fade-in-up"
            style="animation-delay: 0.4s;"
        >

            <p class="text-xs font-semibold text-slate-600/90 tracking-wider font-rubik">
                גדוד 906 • שועלי הנגב
            </p>

        </footer>

    </div>


    <!-- ==================================
         ADMIN MODAL
    ================================== -->

    <div
        id="admin-modal"
        class="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-md flex items-center justify-center p-4 hidden opacity-0"
    >

        <div class="bg-white/95 border border-slate-200 rounded-3xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[85vh] text-right">

            <!-- MODAL HEADER -->

            <div class="flex justify-between items-center border-b border-gray-100 pb-3.5 mb-4">

                <div class="flex items-center gap-2.5">

                    <div class="w-9 h-9 rounded-2xl bg-slate-100 text-slate-700 flex items-center justify-center text-base font-bold shadow-sm">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </div>

                    <div>
                        <h2 class="text-lg font-bold text-gray-900 font-rubik">
                            עריכת קישורים
                        </h2>

                        <p class="text-xs text-gray-500">
                            שנה את כותרות הקישורים והכתובות
                        </p>
                    </div>

                </div>

                <button
                    onclick="toggleAdminModal()"
                    class="text-gray-400 hover:text-gray-700 w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center transition admin-button"
                    aria-label="סגור"
                >
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

            </div>


            <!-- EDITABLE LINKS LIST -->

            <div
                id="admin-links-list"
                class="space-y-3.5 overflow-y-auto pr-1 flex-1 mb-4"
            >
            </div>


            <!-- MODAL FOOTER -->

            <div class="pt-3.5 border-t border-gray-100 flex justify-between items-center gap-2">

                <button
                    onclick="addNewLink()"
                    class="px-3.5 py-2 rounded-xl bg-purple-50 hover:bg-slate-100 text-slate-700 font-bold text-xs flex items-center gap-1.5 transition admin-button"
                >
                    <i class="fa-solid fa-plus"></i>
                    הוסף כפתור
                </button>

                <div class="flex gap-2">

                    <button
                        onclick="resetToDefaults()"
                        class="px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-semibold transition admin-button"
                    >
                        איפוס
                    </button>

                    <button
                        onclick="saveAdminChanges()"
                        class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-800 text-white font-bold text-xs shadow-md shadow-slate-200 transition admin-button"
                    >
                        שמור שינויים
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ==================================
         NOTIFICATION TOAST
    ================================== -->

    <div
        id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-semibold opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2"
    >

        <i class="fa-solid fa-circle-check text-slate-300"></i>

        <span id="toast-text">
            השינויים נשמרו בהצלחה
        </span>

    </div>


    <!-- ==================================
         JAVASCRIPT
    ================================== -->

    <script>

        // ==================================
        // DEFAULT LINKS
        // אין תמונות בכפתורים
        // ==================================

        const defaultLinks = [
            {
                id: '1',
                title: 'אתר בית הספר למפקדים',
                url: 'https://www.idf.il/'
            },

            {
                id: '2',
                title: 'עמוד האינסטגרם הגדודי',
                url: 'https://instagram.com'
            },

            {
                id: '3',
                title: 'קבוצת עדכונים והודעות',
                url: 'https://whatsapp.com'
            }
        ];


        let links = [];


        // ==================================
        // LOAD LINKS
        // ==================================

        function loadLinks() {

            const stored = localStorage.getItem('shualei_906_inspo_links');

            if (stored) {

                try {

                    const savedLinks = JSON.parse(stored);

                    links = savedLinks.map(link => ({
                        id: link.id || Date.now().toString(),
                        title: link.title || '',
                        url: link.url || ''
                    }));

                } catch (e) {

                    links = JSON.parse(JSON.stringify(defaultLinks));

                }

            } else {

                links = JSON.parse(JSON.stringify(defaultLinks));

            }

            renderMainLinks();

        }


        // ==================================
        // RENDER MAIN LINKS
        // ==================================

        function renderMainLinks() {

            const container = document.getElementById('links-container');

            container.innerHTML = '';

            if (links.length === 0) {

                container.innerHTML = `
                    <div class="text-center p-6 text-slate-700 bg-white/40 backdrop-blur-sm rounded-2xl border border-dashed border-slate-400">
                        אין קישורים מוצגים כרגע. לחץ על הסמל למעלה להוספה.
                    </div>
                `;

                return;

            }


            links.forEach((link, idx) => {

                const a = document.createElement('a');

                a.href = link.url || '#';

                a.target = '_blank';

                a.rel = 'noopener noreferrer';

                a.className = `
                    inspo-card
                    relative
                    w-full
                    h-20
                    rounded-2xl
                    flex
                    items-center
                    overflow-hidden
                    cursor-pointer
                    fade-in-up
                    group
                `;

                a.style.animationDelay = `${0.12 + (idx * 0.08)}s`;


                // No images - regular icon only

                a.innerHTML = `

                    <div class="w-16 h-full flex items-center justify-center shrink-0">

                        <i class="fa-solid fa-link link-icon-fallback"></i>

                    </div>

                    <div class="w-px h-10 bg-slate-400/40 shrink-0"></div>

                    <div class="flex-1 min-w-0 px-4 text-right flex items-center justify-between gap-3">

                        <span class="link-title text-base sm:text-lg font-bold text-slate-800 tracking-wide font-rubik truncate">
                            ${escapeHtml(link.title || 'קישור')}
                        </span>

                        <i class="chevron-icon fa-solid fa-chevron-left text-sm text-slate-500 opacity-70"></i>

                    </div>

                `;


                // Mobile press feedback

                a.addEventListener('pointerdown', () => {
                    a.classList.add('is-pressed');
                });

                ['pointerup', 'pointercancel', 'pointerleave'].forEach(eventName => {

                    a.addEventListener(eventName, () => {
                        a.classList.remove('is-pressed');
                    });

                });


                container.appendChild(a);

            });

        }


        // ==================================
        // ADMIN LIST
        // ==================================

        function renderAdminList() {

            const list = document.getElementById('admin-links-list');

            list.innerHTML = '';


            links.forEach((link, idx) => {

                const div = document.createElement('div');

                div.className = 'bg-slate-50 border border-slate-200 p-3 rounded-2xl flex flex-col gap-2 relative';


                div.innerHTML = `

                    <div class="flex justify-between items-center text-xs font-bold text-slate-500">

                        <span>כפתור ${idx + 1}</span>

                        <button
                            onclick="removeLink(${idx})"
                            class="text-red-500 hover:text-red-700 p-1 rounded-lg hover:bg-red-50 transition admin-button"
                            title="מחק"
                        >
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>

                    </div>


                    <div class="space-y-1.5">

                        <input
                            type="text"
                            value="${escapeHtml(link.title)}"
                            oninput="updateData(${idx}, 'title', this.value)"
                            class="admin-input font-rubik"
                            placeholder="שם הכפתור"
                        >

                        <input
                            type="text"
                            value="${escapeHtml(link.url)}"
                            oninput="updateData(${idx}, 'url', this.value)"
                            class="admin-input url-input"
                            dir="ltr"
                            placeholder="קישור ליעד (https://...)"
                        >

                    </div>

                `;

                list.appendChild(div);

            });

        }


        // ==================================
        // UPDATE DATA
        // ==================================

        function updateData(idx, key, val) {

            links[idx][key] = val;

        }


        // ==================================
        // ADD NEW LINK
        // ==================================

        function addNewLink() {

            links.push({

                id: Date.now().toString(),

                title: 'כפתור חדש',

                url: 'https://'

            });

            renderAdminList();

        }


        // ==================================
        // REMOVE LINK
        // ==================================

        function removeLink(idx) {

            links.splice(idx, 1);

            renderAdminList();

        }


        // ==================================
        // RESET LINKS
        // ==================================

        function resetToDefaults() {

            if (confirm('האם להחזיר את הקישורים לברירת המחדל?')) {

                links = JSON.parse(JSON.stringify(defaultLinks));

                renderAdminList();

                saveAdminChanges();

            }

        }


        // ==================================
        // SAVE CHANGES
        // ==================================

        function saveAdminChanges() {

            // Validate links

            const invalidLink = links.find(link => {

                if (!link.url) return false;

                return !/^https?:\/\/.+/i.test(link.url);

            });

            if (invalidLink) {

                alert('יש להזין כתובת קישור תקינה שמתחילה ב-https:// או http://');

                return;

            }


            localStorage.setItem(
                'shualei_906_inspo_links',
                JSON.stringify(links)
            );

            renderMainLinks();

            toggleAdminModal();

            showToast('השינויים נשמרו בהצלחה!');

        }


        // ==================================
        // ADMIN MODAL TOGGLE
        // ==================================

        function toggleAdminModal() {

            const modal = document.getElementById('admin-modal');

            if (modal.classList.contains('hidden')) {

                renderAdminList();

                modal.classList.remove('hidden');

                setTimeout(() => {

                    modal.classList.remove('opacity-0');

                }, 10);

            } else {

                modal.classList.add('opacity-0');

                setTimeout(() => {

                    modal.classList.add('hidden');

                }, 300);

            }

        }


        // ==================================
        // TOAST
        // ==================================

        function showToast(msg) {

            const toast = document.getElementById('toast');

            document.getElementById('toast-text').textContent = msg;

            toast.classList.remove('opacity-0');

            setTimeout(() => {

                toast.classList.add('opacity-0');

            }, 2500);

        }


        // ==================================
        // ESCAPE HTML
        // ==================================

        function escapeHtml(str) {

            return String(str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==================================
        // INITIALIZE
        // ==================================

        window.onload = function() {

            loadLinks();

        };

    </script>

</body>
</html>
